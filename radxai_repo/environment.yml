# RadXAI — Stage 7: GRPO Selective Retrieval
# Create with:
#   conda env create -f environment.yml
#   conda activate radxai
#
# Tested on: NVIDIA V100-32GB / A100, CUDA 11.8+

name: radxai
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - pandas=2.2.1
  - pyarrow=15.0.0
  - pillow=10.2.0
  - tqdm=4.66.2
  - pytorch=2.1.2
  - pytorch-cuda=11.8
  - faiss-gpu=1.7.2         # swap to faiss-cpu if the cluster lacks a GPU faiss build
  - pip:
      - transformers==4.38.2
      - peft==0.9.0
      - accelerate==0.27.2
      - bitsandbytes==0.42.0
      - kaggle==1.6.6